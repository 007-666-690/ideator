name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: pip install -r backend/requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: Levantar Ideator con IA simulada
        working-directory: backend
        run: |
          DATABASE_URL=sqlite:///./e2e.db LLM_PROVIDER=fake FRONTEND_DIST=../frontend/dist \
            nohup uvicorn app.main:create_app --factory --port 8000 > ../uvicorn.log 2>&1 &
          sleep 5 && curl -sf http://localhost:8000/api/health
      - run: python e2e/walkthrough.py http://localhost:8000 e2e-shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e-shots
